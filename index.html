<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Blob Foundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One dark studio world by choice: the form sits on black like a render, the controls stay quiet beside it. */
  /* Layout: stage (square canvas) + one control column; stacks on phones with the stage on top. */
  --ink:#0b090e;
  --panel:#14111a;
  --raise:#1d1925;
  --line:#2c2636;
  --text:#ede7f1;
  --muted:#958ca1;
  --accent:#f4a3cc;
  --accent-ink:#2a0f1e;
  --violet:#a493ff;
  --display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:400 13px/1.45 var(--mono);display:grid;grid-template-rows:minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

/* ---------- stage ---------- */
.stage{position:relative;display:grid;place-items:center;background:#000;min-height:0;container-type:size}
.frame{--arn:1.7778;container-type:inline-size;position:relative;width:min(100cqw,calc(100cqh * var(--arn)));aspect-ratio:16/9;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.frame.orbit #gl{cursor:grab}
.frame.orbit #gl:active{cursor:grabbing}
#ring{position:absolute;border:1px solid rgba(255,255,255,.75);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:difference;display:none}
.micro{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between;gap:8px;padding:0 12px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#fff;mix-blend-mode:difference;pointer-events:none;white-space:nowrap}
.micro span{overflow:hidden;text-overflow:ellipsis}
.corner{position:absolute;top:10px;display:flex;gap:6px}
.corner.l{left:10px}.corner.r{right:10px}
.corner.bl{top:auto;bottom:24px;left:10px}.corner.br{top:auto;bottom:24px;right:10px}
.segchip{display:flex;align-items:center;gap:2px;padding:3px;height:34px;border-radius:17px;border:1px solid rgba(255,255,255,.16);background:rgba(20,17,26,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.segchip button{height:26px;border:0;border-radius:13px;background:none;padding:0 11px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.segchip button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.chip{height:34px;min-width:34px;padding:0 11px;border-radius:17px;border:1px solid rgba(255,255,255,.16);background:rgba(20,17,26,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.chip:disabled{opacity:.35;cursor:default}
.chip.go{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.menu{position:absolute;right:0;top:40px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:2px;min-width:210px;z-index:5}
.menu.open{display:flex}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--line)}
#toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;display:none;max-width:86%;text-align:center;z-index:6}

/* ---------- panel ---------- */
.panel{background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;max-height:52dvh;border-top:1px solid var(--line);border-radius:18px 18px 0 0}
body.closed .panel{display:none}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px 6px 16px}
.phead h2{flex:1;margin:0;font:700 15px/1.2 var(--display);letter-spacing:-.01em}
.pclose{background:var(--raise)!important;backdrop-filter:none}
.pclose svg{transform:rotate(90deg)}
.rail{display:flex;align-items:stretch;background:#0e0c12;border-top:1px solid var(--line);padding:4px 6px calc(6px + env(safe-area-inset-bottom))}
.rail .logo{display:none}
.rail button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;padding:6px 0;color:var(--muted);font-size:10px;letter-spacing:.04em}
.rail button svg{width:44px;height:28px;padding:3px 11px;border-radius:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail button[aria-pressed="true"]{color:var(--accent)}
.rail button[aria-pressed="true"] svg{background:rgba(244,163,204,.16)}
.chip.go{display:flex;align-items:center;gap:7px}
.chip.go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.popsec{display:flex;flex-direction:column;gap:10px}
.popsec+.popsec{border-top:1px solid var(--line);padding-top:12px}
.prow{display:grid;grid-template-columns:88px minmax(0,1fr) 34px;align-items:center;gap:8px}
.prow output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.editbar{position:absolute;left:50%;top:54px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 5px 5px 14px;border-radius:20px;background:rgba(20,17,26,.86);border:1px solid var(--accent);font-size:11px;white-space:nowrap;z-index:6;max-width:94%}
.editbar span{overflow:hidden;text-overflow:ellipsis}
.frame.bgedit #gl{cursor:move}
.exbody{display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px 0}
.brand .bt{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand h1{font:700 13px/1 var(--display);letter-spacing:-.01em;margin:0}
.brand small{display:none}
.seg.lang{flex:none;grid-auto-columns:auto;padding:2px;border-radius:9px}
.seg.lang button{padding:5px 9px;font-size:11px;letter-spacing:.06em}
.spinbar{display:flex;align-items:center;justify-content:center;width:104px;cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden;
  background:linear-gradient(90deg,rgba(244,163,204,.62) var(--fill,0%),rgba(20,17,26,.72) var(--fill,0%))}
.spinbar::after{content:"";position:absolute;inset:auto 10px 5px;height:2px;border-radius:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 10%)}
.spinbar.on{border-color:rgba(244,163,204,.8)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:12px 2px 10px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.body{overflow-y:auto;padding:14px 16px 28px;-webkit-overflow-scrolling:touch}
.pane{display:none;flex-direction:column;gap:16px}
.pane.on{display:flex}
.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tool{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.04em}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.hint{color:var(--muted);font-size:12px;min-height:1.45em}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 34px;align-items:center;gap:10px}
.row output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--text);margin-top:-8px;border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--text);border:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:7px;padding:7px 4px;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--text)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.btn.quiet{background:none}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sw{background:none;border:1px solid transparent;border-radius:12px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);min-width:0}
.sw canvas{width:52px;height:52px;border-radius:50%;display:block}
.sw span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--raise)}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color{display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.color input{width:30px;height:30px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.color input::-webkit-color-swatch-wrapper{padding:0}
.color input::-webkit-color-swatch{border:1px solid var(--line);border-radius:50%}
.color input::-moz-color-swatch{border:1px solid var(--line);border-radius:50%}
#matName{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.bgs{display:flex;gap:8px;align-items:center}
.bg{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);padding:0}
.bg[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}

.drop{border:1px dashed var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.drop.over{border-color:var(--accent);background:var(--raise)}
.board{columns:2;column-gap:10px}
.tile{break-inside:avoid;margin:0 0 10px;background:var(--raise);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.tile img{display:block;width:100%;max-width:100%}
.pal{display:grid;grid-template-columns:repeat(5,1fr)}
.pal button{height:22px;border:0;padding:0}
.tile .btns{padding:8px;gap:6px}
.tile .btn{padding:6px 9px;font-size:11px;background:var(--panel)}
.empty{color:var(--muted);font-size:12px}

.chip.icon{padding:0;width:34px;display:grid;place-items:center}
.chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:transparent}
.bgchip{display:flex;align-items:center;gap:7px}
.bgchip i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.45);display:block;flex:none}
.pop{position:absolute;left:0;top:40px;width:min(300px,86vw);max-height:min(620px,78dvh);overflow-y:auto;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px;display:none;flex-direction:column;gap:10px;z-index:5}
.pop.open{display:flex}
.bgui{display:flex;flex-direction:column;gap:10px}
.bgui .bgs{flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:default}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;columns:auto}
.tile{aspect-ratio:1;margin:0;padding:0;display:block;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--raise);cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover}
.tile[aria-pressed="true"]{border-color:var(--accent)}
.palrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.palrow button{height:30px;border-radius:8px;border:1px solid var(--line);padding:0}
.slot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slot .thumb{width:60px;height:60px;flex:none}
.slot .thumb img,.slot .thumb .ph{display:block;width:60px;height:60px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.slot .thumb .ph{border-style:dashed}
.sub{display:flex;flex-direction:column;gap:8px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--text)}
#refClip{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.axis{position:absolute;pointer-events:none}
.ax-x{top:0;bottom:0;width:0;border-left:1px dashed rgba(244,163,204,.85)}
.ax-y{left:0;right:0;height:0;border-top:1px dashed rgba(244,163,204,.85)}
.axknob{position:absolute;pointer-events:auto;width:26px;height:26px;border-radius:50%;border:0;padding:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.4);touch-action:none}
.axknob svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ax-x .axknob{top:52px;left:-13px;cursor:ew-resize}
.ax-y .axknob{right:10px;top:-13px;cursor:ns-resize}
.frame.bgedit .axis{display:none}
#refImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,4,8,.72);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mhead h2{font:700 15px/1.2 var(--display);margin:0}
#shapeCv{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain;border-radius:10px;background:#000;cursor:crosshair}
@container (max-width:560px){.bgchip span{display:none}.bgchip{padding:0;width:34px;justify-content:center}#exportChip span{display:none}#exportChip{padding:0;width:34px;justify-content:center}}
@media (max-width:520px){.micro span:first-child{display:none}.bgchip span{display:none}.bgchip{padding:0;width:34px;justify-content:center}}
@media (min-width:880px){
  body{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) auto 76px}
  .panel{width:360px;max-height:none;border-top:0;border-radius:0;border-left:1px solid var(--line);box-shadow:-18px 0 40px rgba(0,0,0,.3)}
  .phead{padding:18px 14px 8px 18px}
  .phead h2{font-size:17px}
  .pclose svg{transform:none}
  .rail{flex-direction:column;align-items:center;gap:8px;border-top:0;border-left:1px solid var(--line);padding:18px 0}
  .rail .logo{display:block;width:34px;height:34px;border-radius:50%;margin-bottom:14px;background:radial-gradient(circle at 35% 30%,#fff 0%,#f6c3dc 18%,#e98bbd 79%,#6f63e6 100%)}
  .rail button{flex:none;width:58px;height:66px;border-radius:16px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#c9c1d3}
  .rail button svg{width:22px;height:22px;padding:0;border-radius:0}
  .rail button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .rail button[aria-pressed="true"] svg{background:none}
  .rail button:hover:not([aria-pressed="true"]){background:var(--raise)}
  .brand{padding:18px 16px 8px}
  .brand h1{font-size:17px}
  .brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
}
</style>
</head>
<body>

<section class="stage" aria-label="Canvas">
  <div class="frame" id="frame">
    <canvas id="gl" data-i18n-aria="a.canvas"></canvas>
    <div id="refClip" aria-hidden="true"><img id="refImg" alt="" hidden></div>
    <div id="ring"></div>
    <div class="axis ax-x" id="axisX" hidden><button class="axknob" id="axKnobX" data-i18n-aria="axis" data-i18n-title="axis.tip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg></button></div>
    <div class="axis ax-y" id="axisY" hidden><button class="axknob" id="axKnobY" data-i18n-aria="axis" data-i18n-title="axis.tip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l4-4 4 4M8 16l4 4 4-4"/></svg></button></div>
    <div class="corner l">
      <button class="chip icon" id="undo" data-i18n-title="a.undo" data-i18n-aria="a.undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="chip icon" id="redo" data-i18n-title="a.redo" data-i18n-aria="a.redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="chip bgchip" id="bgChip" data-i18n-aria="bg" aria-haspopup="true" aria-expanded="false" aria-controls="bgMenu"><i id="bgDot"></i><span data-i18n="bg"></span></button>
      <div class="pop" id="bgMenu"><div class="popsec"><div class="label" data-i18n="color"></div><div class="bgui"></div></div><div class="popsec">
        <div class="label" data-i18n="bgimg.short"></div>
        <div class="slot"><div class="thumb" id="bgThumb"></div>
          <div class="btns"><button class="btn" id="bgPick" data-i18n="choose"></button><button class="btn quiet" id="bgClear" data-i18n="remove"></button></div>
          <input type="file" id="bgFile" accept="image/*" hidden>
        </div>
        <div class="sub" id="bgOpts">
          <div class="seg" id="bgFitSeg" role="group" data-i18n-aria="fit"><button data-v="cover" data-i18n="fit.cover"></button><button data-v="contain" data-i18n="fit.contain"></button></div>
          <div class="prow"><label class="label" for="bgZoom" data-i18n="zoom"></label><input type="range" id="bgZoom" min="0.5" max="5" step="0.01"><output id="bgZoomOut"></output></div>
          <div class="prow"><label class="label" for="bgRot" data-i18n="rot"></label><input type="range" id="bgRot" min="-180" max="180" step="1"><output id="bgRotOut"></output></div>
          <div class="prow"><label class="label" for="bgX" data-i18n="posx"></label><input type="range" id="bgX" min="-1" max="1" step="0.005"><output id="bgXOut"></output></div>
          <div class="prow"><label class="label" for="bgY" data-i18n="posy"></label><input type="range" id="bgY" min="-1" max="1" step="0.005"><output id="bgYOut"></output></div>
          <div class="prow"><label class="label" for="bgDim" data-i18n="dim"></label><input type="range" id="bgDim" min="0" max="0.85" step="0.01"><output id="bgDimOut"></output></div>
          <div class="prow"><label class="label" for="bgBlur" data-i18n="blur"></label><input type="range" id="bgBlur" min="0" max="1" step="0.01"><output id="bgBlurOut"></output></div>
          <div class="btns"><button class="btn pri" id="bgEditBtn" data-i18n="bgedit"></button><button class="btn quiet" id="bgReset" data-i18n="bgreset"></button></div>
        </div>
        <div class="hint" data-i18n="bgimg.hint"></div>
      </div></div>
    </div>
    <div class="corner r">
      <div class="segchip" id="dim" role="group" data-i18n-aria="a.view"><button data-v="2d" aria-pressed="true">2D</button><button data-v="3d" aria-pressed="false">3D</button></div>
      <button class="chip go" id="exportChip" data-i18n-aria="export"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg><span data-i18n="export"></span></button>
    </div>
    <div class="corner bl" id="v2dBox">
      <div class="segchip" id="v2d" role="group" data-i18n-aria="a.view2d"><button data-v="front" aria-pressed="true" data-i18n="v.front"></button><button data-v="side" aria-pressed="false" data-i18n="v.side"></button><button data-v="top" aria-pressed="false" data-i18n="v.top"></button></div>
    </div>
    <div class="corner bl" id="modeBox" hidden>

/* melt: separable box blur, twice, recomputed only around what changed */
function meltR(){return Math.round(S.melt*0.45);}

/* surface nets */
const EDGES=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];

/* the four cells around an edge are listed so their winding faces +x, -y, +z; flip when the inside is on the far side */
function orient(ax,inside){return (ax===1?false:true)===inside;}
function initChunks(){

/* ray casting, for drawing on the piece in 3D */
function raycast(A,a,b){
  let pa=toV(a[0],a[1],a[2]),pb=toV(b[0],b[1],b[2]);

    let u=(lo[ax]-pa[ax])/d[ax],v=(hi[ax]-pa[ax])/d[ax];if(u>v){const s=u;u=v;v=s;}

      for(let it=0;it<6;it++){const m=(l+r)/2;if(sampleA(A,NX,NY,NZ,pa[0]+d[0]*m,pa[1]+d[1]*m,pa[2]+d[2]*m)>=ISO)r=m;else l=m;}

      let gy=sampleA(A,NX,NY,NZ,hx,hy+1,hz)-sampleA(A,NX,NY,NZ,hx,hy-1,hz);
      let gz=sampleA(A,NX,NY,NZ,hx,hy,hz+1)-sampleA(A,NX,NY,NZ,hx,hy,hz-1);

/* compact storage for undo and saving: run-length encoding (3 bytes per run) */
function rleEncode(u){

/* ================= mood board ================= */
function hex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function unhex(c){const n=parseInt(c.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function kmeans(px,wts,k){
  let cen=[];for(let i=0;i<k;i++)cen.push(px[Math.floor((i+0.5)/k*px.length)].slice());
  let cnt=new Array(k).fill(0);
  for(let it=0;it<10;it++){
    const sum=cen.map(()=>[0,0,0,0]);
    px.forEach((p,n)=>{let b=0,bd=1e9;for(let j=0;j<k;j++){const c=cen[j],dd=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;if(dd<bd){bd=dd;b=j;}}
      const s=sum[b],w=wts?wts[n]:1;s[0]+=p[0]*w;s[1]+=p[1]*w;s[2]+=p[2]*w;s[3]+=w;});
    cnt=sum.map(s=>s[3]);cen=sum.map((s,j)=>s[3]?[s[0]/s[3],s[1]/s[3],s[2]/s[3]]:cen[j]);
  }
  const tot=cnt.reduce((a,b)=>a+b,0)||1;
  const sat=c=>{const mx=Math.max(...c),mn=Math.min(...c);return mx?(mx-mn)/mx:0;};
  // plain greys and paper whites sink to the end, so the colours you actually like come first
  return cen.map((c,j)=>({c,score:(0.2+sat(c))*Math.sqrt(cnt[j]/tot)*(0.3+Math.max(...c)/255)})).sort((a,b)=>b.score-a.score);
}
function palette(ctx,w,h){
  const d=ctx.getImageData(0,0,w,h).data,px=[];
  for(let i=0;i<d.length;i+=4)if(d[i+3]>128)px.push([d[i],d[i+1],d[i+2]]);
  if(px.length<5)return ['#cccccc','#999999','#666666','#333333','#000000'];
  return kmeans(px,null,5).map(o=>hex(o.c[0],o.c[1],o.c[2]));
}
function sharedPalette(){
  if(!board.length)return [];
  const px=[],w=[];
  board.forEach(t=>t.pal.forEach((c,i)=>{px.push(unhex(c));w.push(5-i);}));
  if(px.length<5)return board[0].pal.slice();
  return kmeans(px,w,5).map(o=>hex(o.c[0],o.c[1],o.c[2]));
}
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error(tx('err.image')));im.src=src;});}
async function fileToImage(f){const u=URL.createObjectURL(f);try{return await loadImage(u);}finally{setTimeout(()=>URL.revokeObjectURL(u),2000);}}
function scaled(im,max,type,q){
  const c=document.createElement('canvas'),s=Math.min(1,max/Math.max(im.width,im.height));
  c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);return c.toDataURL(type||'image/jpeg',q||0.85);
}
function hasAlpha(im){
  const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(im,0,0,48,48);
  const d=x.getImageData(0,0,48,48).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]<200)n++;return n>48*48*0.02;
}
async function pin(files){
  for(const f of files){
    if(!f.type||!f.type.startsWith('image/'))continue;
    try{
      const im=await fileToImage(f),alpha=hasAlpha(im);
      const src=scaled(im,1024,alpha?'image/png':'image/jpeg',0.82);
      const c=document.createElement('canvas'),x=c.getContext('2d'),s=Math.min(im.width,im.height);
      c.width=c.height=256;x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);const ball=c.toDataURL('image/jpeg',0.85);
      c.width=c.height=40;x.clearRect(0,0,40,40);x.drawImage(im,0,0,40,40);const pal=palette(x,40,40);
      const t={id:'b'+Date.now().toString(36)+(Math.random()*1e4|0),src,ball,pal,name:(f.name||tx('image')).replace(/\.[^.]+$/,'').slice(0,18)};
      board.unshift(t);selTile=t.id;

}

function bgMove(e){const p=bgPts.get(e.pointerId);if(!p)return;const r=cv.getBoundingClientRect(),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;

const SH={im:null,w:0,h:0,data:null,mask:null,seeds:[],invert:false,fill:true,tol:40,alpha:false};
const shCv=$('#shapeCv'),shX=shCv.getContext('2d');
async function openShape(src){
  try{
    const im=await loadImage(src),s=Math.min(1,360/Math.max(im.width,im.height));
    SH.w=Math.max(1,Math.round(im.width*s));SH.h=Math.max(1,Math.round(im.height*s));
    const c=document.createElement('canvas');c.width=SH.w;c.height=SH.h;const x=c.getContext('2d');x.drawImage(im,0,0,SH.w,SH.h);
    SH.data=x.getImageData(0,0,SH.w,SH.h).data;SH.im=c;SH.seeds=[];SH.invert=false;SH.alpha=hasAlpha(im);
    shCv.width=SH.w;shCv.height=SH.h;
    $('#shapeModal').hidden=false;syncShapeBtns();computeMask();$('#shapeMake').focus();
  }catch(e){toast(e.message);}
}
function closeShape(){$('#shapeModal').hidden=true;SH.data=null;SH.mask=null;}
const cdist=(d,i,c)=>Math.sqrt((d[i]-c[0])**2+(d[i+1]-c[1])**2+(d[i+2]-c[2])**2);
function computeMask(){
  const {w,h,data:d}=SH,n=w*h,m=new Uint8Array(n),tol=SH.tol;
  if(SH.seeds.length){
    for(const sd of SH.seeds){
      const c=[0,0,0];let cn=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=Math.min(w-1,Math.max(0,sd[0]+dx)),y=Math.min(h-1,Math.max(0,sd[1]+dy)),i=(y*w+x)*4;c[0]+=d[i];c[1]+=d[i+1];c[2]+=d[i+2];cn++;}
      c[0]/=cn;c[1]/=cn;c[2]/=cn;
      const st=[sd[1]*w+sd[0]],seen=new Uint8Array(n);seen[st[0]]=1;
      while(st.length){const q=st.pop(),i=q*4;if(d[i+3]<40||cdist(d,i,c)>tol*1.6)continue;m[q]=1;
        const x=q%w,y=(q/w)|0;
        if(x>0&&!seen[q-1]){seen[q-1]=1;st.push(q-1);} if(x<w-1&&!seen[q+1]){seen[q+1]=1;st.push(q+1);}

const baseName=()=>'blob-foundry-'+String(S.seed).padStart(4,'0');
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function zipOne(name,blob){
  const data=new Uint8Array(await blob.arrayBuffer()),nm=new TextEncoder().encode(name),crc=crc32(data),sz=data.length;
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
  const cd=new DataView(new ArrayBuffer(46));
  cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint16(14,0x21,true);cd.setUint32(16,crc,true);cd.setUint32(20,sz,true);cd.setUint32(24,sz,true);cd.setUint16(28,nm.length,true);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,1,true);end.setUint16(10,1,true);end.setUint32(12,46+nm.length,true);end.setUint32(16,30+nm.length+sz,true);
  return new Blob([lh.buffer,nm,data,cd.buffer,nm,end.buffer],{type:'application/zip'});
}
async function deliver(name,blob){
  const ext=name.split('.').pop();
  if(dl){
    let n=name,b=blob;
    if(ext==='obj'||ext==='ply'){b=await zipOne(name,blob);n=name.replace(/\.(obj|ply)$/,'-$1.zip');}
    try{await dl.save({filename:n,data:b});toast(tx('saved'));}
    catch(err){if(err&&err.code==='declined')return;toast(tx('save.na'));}
    return;
  }
  try{
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),8000);toast(tx('savedDl'));
  }catch(e){toast(tx('save.blocked'));}
}

async function exportPNG(alpha){
  engineFinish();
  const short=segVal('pngSize')||1080, cap=Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0],4096);
  let W=ASP>=1?Math.round(short*ASP):short, Hh=ASP>=1?short:Math.round(short/ASP);
  const wantPx=Math.max(W,Hh); if(wantPx>cap){const f=cap/wantPx;W=Math.round(W*f);Hh=Math.round(Hh*f);}
  const size=Math.max(W,Hh), oldW=cv.width, oldH=cv.height; let blob=null;
  recording=true;
  try{
    cv.width=W;cv.height=Hh;
    if(!alpha){render();blob=await new Promise(r=>cv.toBlob(r,'image/png'));}
    else{
      const A=new Uint8Array(W*Hh*4),B=new Uint8Array(W*Hh*4);
      render([0,0,0]);gl.readPixels(0,0,W,Hh,gl.RGBA,gl.UNSIGNED_BYTE,A);
      render([1,1,1]);gl.readPixels(0,0,W,Hh,gl.RGBA,gl.UNSIGNED_BYTE,B);
      const c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d'),im=x.createImageData(W,Hh),D=im.data;
      for(let y=0;y<Hh;y++){const so=(Hh-1-y)*W*4,dn=y*W*4;
        for(let i=0;i<W*4;i+=4){
          const a=1-((B[so+i]-A[so+i])+(B[so+i+1]-A[so+i+1])+(B[so+i+2]-A[so+i+2]))/765;
          if(a<=0.004)continue;
          D[dn+i]=Math.min(255,A[so+i]/a);D[dn+i+1]=Math.min(255,A[so+i+1]/a);D[dn+i+2]=Math.min(255,A[so+i+2]/a);D[dn+i+3]=Math.min(255,a*255);
        }}
      x.putImageData(im,0,0);blob=await new Promise(r=>c.toBlob(r,'image/png'));
    }
  }catch(err){blob=null;}
  cv.width=oldW;cv.height=oldH;recording=false;render();want();
  if(!blob){toast(tx('png.fail'));return;}
  if(size<wantPx)toast(tx('png.capped',{s:size}));
  await deliver(baseName()+(alpha?'-transparent':'')+'.png',blob);
}

/* closed mesh straight from the volume (surface nets, shared vertices) */
function buildMesh(stride){
  engineFinish();
  let A=M,nx=NX,ny=NY,nz=NZ,hh=h;
  if(stride===2){
    nx=NX>>1;ny=NY>>1;nz=NZ>>1;hh=h*2;A=new Uint8Array(nx*ny*nz);
    for(let k=0;k<nz;k++)for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){let s=0;
      for(let c=0;c<8;c++)s+=M[vid(2*i+(c&1),2*j+((c>>1)&1),2*k+((c>>2)&1))];A[(k*ny+j)*nx+i]=(s/8+0.5)|0;}
  }
  const pos=[],nor=[],idx=[],map=new Map(),pf=S.puff;
  const V=(i,j,k)=>{const key=(k*ny+j)*nx+i;let v=map.get(key);
    if(v===undefined){const c=cellVert(A,nx,ny,nz,i,j,k);if(!c)v=-1;else{v=pos.length/3;
      pos.push(-ASP+(c[0]+0.5)*hh,-1+(c[1]+0.5)*hh,(-ZR+(c[2]+0.5)*hh)*pf);
      const l=Math.hypot(c[3],c[4],c[5]/pf)||1;nor.push(c[3]/l,c[4]/l,c[5]/pf/l);}
      map.set(key,v);}
    return v;};
  netsWalk(A,nx,ny,nz,0,nx-1,0,ny-1,0,nz-1,(i,j,k)=>[i,j,k],(a,b,c,d,ax,ins)=>{
    const va=V(a[0],a[1],a[2]),vb=V(b[0],b[1],b[2]),vc=V(c[0],c[1],c[2]),vd=V(d[0],d[1],d[2]);
    if(va<0||vb<0||vc<0||vd<0)return;
    if(orient(ax,ins)){idx.push(va,vb,vc,va,vc,vd);}else{idx.push(va,vc,vb,va,vd,vc);}
  });
  return {P:new Float32Array(pos),N:new Float32Array(nor),I:new Uint32Array(idx)};
}
const f5=v=>(Math.abs(v)<5e-6?0:v).toFixed(5);
function toOBJ(m){
  const {P,N:Nn,I}=m,nv=P.length/3,out=['# Blob Foundry\n# '+(I.length/3)+' triangles. 2 units tall, Y up.\no blob\n'];
  let ch=[];const flush=()=>{if(ch.length){out.push(ch.join('\n')+'\n');ch=[];}};
  for(let i=0;i<nv;i++){ch.push('v '+f5(P[i*3])+' '+f5(P[i*3+1])+' '+f5(P[i*3+2]));if(ch.length>=20000)flush();}flush();
  for(let i=0;i<nv;i++){ch.push('vt '+f5((P[i*3]/ASP+1)/2)+' '+f5((P[i*3+1]+1)/2));if(ch.length>=20000)flush();}flush();
  for(let i=0;i<nv;i++){ch.push('vn '+Nn[i*3].toFixed(4)+' '+Nn[i*3+1].toFixed(4)+' '+Nn[i*3+2].toFixed(4));if(ch.length>=20000)flush();}flush();
  ch.push('s 1');
  for(let t=0;t<I.length;t+=3){const a=I[t]+1,b=I[t+1]+1,c=I[t+2]+1;ch.push('f '+a+'/'+a+'/'+a+' '+b+'/'+b+'/'+b+' '+c+'/'+c+'/'+c);if(ch.length>=20000)flush();}flush();
  return new Blob(out,{type:'text/plain'});
}
function toPLY(m){
  const {P,N:Nn,I}=m,nv=P.length/3,nf=I.length/3,col=srgb(curMat().base).map(v=>Math.round(v*255));
  const head=new TextEncoder().encode('ply\nformat binary_little_endian 1.0\ncomment Blob Foundry, 2 units tall, Y up\nelement vertex '+nv+'\nproperty float x\nproperty float y\nproperty float z\nproperty float nx\nproperty float ny\nproperty float nz\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nelement face '+nf+'\nproperty list uchar int vertex_indices\nend_header\n');
  const buf=new ArrayBuffer(nv*27+nf*13),d=new DataView(buf);let o=0;
  for(let i=0;i<nv;i++){for(let k=0;k<3;k++){d.setFloat32(o,P[i*3+k],true);o+=4;}for(let k=0;k<3;k++){d.setFloat32(o,Nn[i*3+k],true);o+=4;}d.setUint8(o++,col[0]);d.setUint8(o++,col[1]);d.setUint8(o++,col[2]);}
  for(let t=0;t<I.length;t+=3){d.setUint8(o++,3);d.setInt32(o,I[t],true);d.setInt32(o+4,I[t+1],true);d.setInt32(o+8,I[t+2],true);o+=12;}
  return new Blob([head,buf],{type:'application/octet-stream'});
}
async function exportMesh(fmt){
  const m=buildMesh(segVal('meshDetail')||1);
  if(!m.I.length){toast(tx('empty'));return;}
  const blob=fmt==='obj'?toOBJ(m):toPLY(m);
  $('#meshInfo').textContent=tx('mesh.done',{f:fmt.toUpperCase(),t:(m.I.length/3).toLocaleString(L==='tr'?'tr-TR':'en-US'),mb:(blob.size/1048576).toLocaleString(L==='tr'?'tr-TR':'en-US',{maximumFractionDigits:1})});
  await deliver(baseName()+'.'+fmt,blob);
}
/* 360° turntable video: frame-exact MP4 via WebCodecs, MediaRecorder as a fallback */
let muxLib=null;
function loadMuxer(){
  if(window.Mp4Muxer)return Promise.resolve(window.Mp4Muxer);
  if(!muxLib)muxLib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js';
    sc.onload=()=>window.Mp4Muxer?res(window.Mp4Muxer):rej(new Error('muxer'));sc.onerror=()=>{muxLib=null;rej(new Error('muxer'));};document.head.appendChild(sc);});
  return muxLib;
}
async function pickCodec(w,h,fps){
  for(const c of ['avc1.640028','avc1.640032','avc1.4d0028','avc1.42e028']){try{const r=await VideoEncoder.isConfigSupported({codec:c,width:w,height:h,bitrate:12e6,framerate:fps});if(r.supported)return c;}catch(e){}}
  return null;
}
const tick0=()=>new Promise(r=>setTimeout(r,0));
async function exportVideo(){
  engineFinish();
  const secs=segVal('vidLen')||8,fps=30,n=secs*fps,VW=(ASP>=1?Math.round(1080*ASP/2)*2:1080),VH=(ASP>=1?1080:Math.round(1080/ASP/2)*2);
  const keep={yaw:view.yaw,pitch:view.pitch,k:view.k,zoom:view.zoom},oldW=cv.width,oldH=cv.height;
  const yaw0=view.on?view.yaw:-0.6,pitch=view.on?view.pitch:-0.38,zoom=view.on?view.zoom:1;
  const pose=a=>{view.yaw=yaw0+a;view.pitch=pitch;view.k=1;view.zoom=zoom;};
  let blob=null,ext='mp4';
  recording=true;
  try{
    cv.width=VW;cv.height=VH;
    let done=false;
    if(typeof VideoEncoder!=='undefined'&&typeof VideoFrame!=='undefined'){
      let M=null,codec=null;
      try{M=await loadMuxer();codec=await pickCodec(VW,VH,fps);}catch(e){M=null;}
      if(M&&codec){
        const muxer=new M.Muxer({target:new M.ArrayBufferTarget(),video:{codec:'avc',width:VW,height:VH},fastStart:'in-memory'});
        let err=null;
        const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{err=e;}});
        enc.configure({codec,width:VW,height:VH,bitrate:14e6,framerate:fps});
        for(let i=0;i<n;i++){
          if(err)throw err;
          pose(Math.PI*2*i/n);render();
          const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
          enc.encode(f,{keyFrame:i%(fps*2)===0});f.close();
          while(enc.encodeQueueSize>6)await new Promise(r=>setTimeout(r,4));
          if(i%15===0){toast(tx('video.progress',{p:Math.round(i/n*100)}));await tick0();}
        }
        await enc.flush();if(err)throw err;enc.close();muxer.finalize();
        blob=new Blob([muxer.target.buffer],{type:'video/mp4'});done=true;
      }
    }
    if(!done){
      const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
      const mt=(typeof MediaRecorder!=='undefined'&&cv.captureStream)?types.find(t=>MediaRecorder.isTypeSupported(t)):null;
      if(!mt)throw new Error('novideo');
      const rec=new MediaRecorder(cv.captureStream(fps),{mimeType:mt,videoBitsPerSecond:12e6}),parts=[];
      rec.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data);};
      const stopped=new Promise(r=>{rec.onstop=r;});
      rec.start();const t0=performance.now();let lastP=-1;
      await new Promise(res=>{(function step(){const t=(performance.now()-t0)/1000;if(t>=secs){res();return;}
        pose(Math.PI*2*t/secs);render();const p=Math.floor(t/secs*10)*10;if(p!==lastP){lastP=p;toast(tx('video.progress',{p}));}requestAnimationFrame(step);})();});
      rec.stop();await stopped;
      ext=mt.startsWith('video/mp4')?'mp4':'webm';blob=new Blob(parts,{type:mt.split(';')[0]});
    }
  }catch(e){blob=null;}
  finally{cv.width=oldW;cv.height=oldH;Object.assign(view,keep);recording=false;want();}
  if(!blob||!blob.size){toast(tx('video.fail'));return;}
  await deliver(baseName()+'-360.'+ext,blob);
  if(ext==='webm')setTimeout(()=>toast(tx('video.webm')),2700);
}

const KEY='blob-foundry.v3';let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
  const f=b64e(rleEncode(P));
  try{localStorage.setItem(KEY,JSON.stringify({S,mats,board,f}));}
  catch(e){try{localStorage.setItem(KEY,JSON.stringify({S:{...S,bgImg:null,refImg:null},mats:mats.filter(m=>!m.img),board:[],f}));}catch(_){}}
},700);}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d||!d.S)return false;
    Object.assign(S,d.S);if(!FORMATS[S.fmt])S.fmt='16:9';
    if(Array.isArray(d.mats)&&d.mats.length)mats=d.mats;if(Array.isArray(d.board))board=d.board;
    if(!mats.find(m=>m.id===S.cur))S.cur=mats[0].id;
    setupGrid(S.fmt);
    if(d.f){P.set(rleDecode(b64d(d.f),NV));markAll();return true;}
    return false;
  }catch(e){return false;}
}
